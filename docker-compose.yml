
services:

  postgres:
    image: postgres:17
    container_name: cw_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: cw_platform
      POSTGRES_USER: cw_admin
      POSTGRES_PASSWORD: cw_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: cw_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend

    container_name: cw_backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ./.env

    depends_on:
      - postgres
      - redis

    volumes:
      - ./backend:/app
      
volumes:

  postgres_data: